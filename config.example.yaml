listen: 127.0.0.1:8080                  # becomes :443 automatically when tls is on
base_url: https://panel.example.com     # public URL; used in subscription links and payment callbacks

# Built-in HTTPS. `auto` obtains and renews a Let's Encrypt certificate for the
# base_url host; ports 80 and 443 must be free and reachable from the internet.
# Leave it off when a reverse proxy (Caddy, nginx, a CDN) terminates TLS.
tls:
  auto: false
  email: you@example.com
  # cloudflare_token: ...   # DNS-01: wildcard for the domain, port 80 not needed
  # cert: /etc/captain/fullchain.pem     # or bring your own files
  # key: /etc/captain/privkey.pem
data_dir: /var/lib/captain
log_level: info

database:
  driver: sqlite
  dsn: /var/lib/captain/captain.db

agent:
  pull_seconds: 60
  push_seconds: 60

site_name: Captain

portal:
  registration: true        # allow self sign-up

payments:
  # epay:                    # 易支付 v1 (MD5), e.g. z-pay.cn
  #   version: v1
  #   url: https://zpayz.cn
  #   pid: "1000"
  #   key: secret
  #   type: ""               # alipay | wxpay | "" = cashier page
  # epay:                    # 易支付 v2 (RSA), e.g. ezfp.cn
  #   version: v2
  #   url: https://www.ezfp.cn
