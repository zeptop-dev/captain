listen: 127.0.0.1:8080
base_url: https://panel.example.com     # public URL; used in subscription links and payment callbacks
data_dir: /var/lib/captain
log_level: info

database:
  driver: sqlite
  dsn: /var/lib/captain/captain.db

agent:
  pull_seconds: 60
  push_seconds: 60

site_name: Captain

portal:
  registration: true        # allow self sign-up

payments:
  # epay:                    # 易支付 v1 (MD5), e.g. z-pay.cn
  #   version: v1
  #   url: https://zpayz.cn
  #   pid: "1000"
  #   key: secret
  #   type: ""               # alipay | wxpay | "" = cashier page
  # epay:                    # 易支付 v2 (RSA), e.g. ezfp.cn
  #   version: v2
  #   url: https://www.ezfp.cn
  #   pid: "1001"
  #   merchant_private_key: |
  #     -----BEGIN PRIVATE KEY-----
  #     ...
  #     -----END PRIVATE KEY-----
  #   platform_public_key: MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A...
  # stripe:
  #   secret_key: sk_live_...
  #   webhook_secret: whsec_...
  #   currency: usd
