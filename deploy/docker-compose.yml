# Captain alone. It terminates HTTPS itself (tls.auto in config.yaml), so
# nothing else is needed on the host. Files expected next to this one:
#   config.yaml  - copy of config.docker.yaml with base_url and tls.email set
services:
  captain:
    image: zeptop/captain:latest        # or ghcr.io/zeptop-dev/captain:latest
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./config.yaml:/etc/captain/config.yaml:ro
      - captain-data:/var/lib/captain     # database, daily backups, certificates

  # Optional: recreate the container automatically when a new image is pushed.
  # watchtower:
  #   image: containrrr/watchtower
  #   restart: unless-stopped
  #   volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
  #   command: --cleanup --interval 3600 captain

volumes:
  captain-data:
