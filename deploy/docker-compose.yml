# Captain + Caddy. Put config.yaml and Caddyfile next to this file:
#   config.yaml : copy of config.example.yaml with listen: 0.0.0.0:8080 and
#                 base_url set to https://<your domain>
#   Caddyfile   : the one in this directory, domain edited, upstream captain:8080
services:
  captain:
    image: registry.gitlab.com/boyang-hu/captain:latest   # or zeptop/captain:latest
    restart: unless-stopped
    volumes:
      - ./config.yaml:/etc/captain/config.yaml:ro
      - captain-data:/var/lib/captain
    expose: ["8080"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [captain]

volumes:
  captain-data:
  caddy-data:
  caddy-config:
