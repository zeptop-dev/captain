# Captain behind Caddy (automatic HTTPS). Files expected next to this one:
#   config.yaml  - copy of config.docker.yaml with base_url set
#   Caddyfile    - copy of deploy/Caddyfile with your domain
services:
  captain:
    image: zeptop/captain:latest        # or ghcr.io/zeptop-dev/captain:latest
    restart: unless-stopped
    volumes:
      - ./config.yaml:/etc/captain/config.yaml:ro
      - captain-data:/var/lib/captain
    expose: ["8080"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [captain]

  # Optional: recreate containers automatically when a new image is pushed.
  # watchtower:
  #   image: containrrr/watchtower
  #   restart: unless-stopped
  #   volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
  #   command: --cleanup --interval 3600 captain

volumes:
  captain-data:
  caddy-data:
  caddy-config:
