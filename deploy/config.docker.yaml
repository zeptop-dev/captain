# Captain config for Docker. Copy to config.yaml next to docker-compose.yml.
# Captain terminates HTTPS itself: base_url's host gets a Let's Encrypt
# certificate on first start (ports 80/443 published by the compose file).
listen: 0.0.0.0:443
base_url: https://panel.example.com
data_dir: /var/lib/captain
log_level: info

tls:
  auto: true
  email: you@example.com
  # cloudflare_token: ...   # optional: DNS-01 wildcard certificate, port 80 not needed

database:
  driver: sqlite
  dsn: /var/lib/captain/captain.db

agent:
  pull_seconds: 60
  push_seconds: 60

site_name: Captain

portal:
  registration: true

payments: {}
  # epay:
