stages: [test, build, publish]

variables:
  REGISTRY: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic"
  DOCKERHUB_USER: zeptop
  GOFLAGS: "-mod=mod"
  GOTOOLCHAIN: auto

test:
  stage: test
  image: golang:1.26
  needs: [build:web]          # web/embed.go needs the SPA dist directories to exist
  cache: { key: gomod, paths: [.gocache/] }
  before_script:
    - export GOMODCACHE="$CI_PROJECT_DIR/.gocache/mod" GOCACHE="$CI_PROJECT_DIR/.gocache/build"
  script:
    - git ls-files "*.go" | xargs gofmt -l | tee /dev/stderr | test -z "$(cat)"
    - go vet ./...
    - go test ./...

build:web:
  stage: test
  image: node:24
  cache: { key: pnpm, paths: [web/admin/node_modules/, web/portal/node_modules/] }
  script:
    - corepack enable && corepack prepare pnpm@9 --activate
    - cd web/admin && pnpm install --frozen-lockfile && pnpm exec tsc -b && pnpm build && cd ../..
    - cd web/portal && pnpm install --frozen-lockfile && pnpm exec tsc -b && pnpm build
  artifacts:
    paths: [web/admin/dist/, web/portal/dist/]
    expire_in: 1 week

build:captain:
  stage: build
  image: golang:1.26
  needs: [test, build:web]
  cache: { key: gomod, paths: [.gocache/] }
  before_script:
    - export GOMODCACHE="$CI_PROJECT_DIR/.gocache/mod" GOCACHE="$CI_PROJECT_DIR/.gocache/build"
  script:
    - for arch in amd64 arm64; do CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" -o bin/captain-linux-$arch ./cmd/captain; done
    - cd bin && sha256sum captain-linux-* > SHA256SUMS && cat SHA256SUMS
  artifacts:
    paths: [bin/]
    expire_in: 1 week

publish:captain:
  stage: publish
  needs: [build:captain]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      cd bin
      for f in captain-linux-* SHA256SUMS; do
        curl --fail -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$REGISTRY/captain/$CI_COMMIT_TAG/$f"
        echo " uploaded $f"
      done

# Multi-arch image to the GitLab registry (private, pull with a deploy token)
# and Docker Hub. DOCKERHUB_TOKEN is a masked CI variable.
publish:docker:
  stage: publish
  needs: [test]
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  cache: []
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker context create ci
    - docker buildx create --use ci
    - |
      docker buildx build --platform linux/amd64,linux/arm64 \
        --build-arg VERSION="$CI_COMMIT_TAG" \
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -t "$CI_REGISTRY_IMAGE:latest" \
        -t "$DOCKERHUB_USER/captain:$CI_COMMIT_TAG" -t "$DOCKERHUB_USER/captain:latest" \
        --push .
