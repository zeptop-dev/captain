name: release
on:
  push:
    tags: ["v*"]
  # Dry run from the Actions tab: builds the binaries and the multi-arch
  # images exactly as a tag would, publishes nothing. For trying a change
  # to this workflow (an action upgrade) before it has to work on a tag.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm, cache-dependency-path: "web/*/pnpm-lock.yaml" }
      - run: python3 scripts/i18n-check.py web/admin/src/i18n web/portal/src/i18n web/probe/src/i18n
      - run: cd web/admin && pnpm install --frozen-lockfile && pnpm test && pnpm exec oxlint src && pnpm build
      - run: cd web/portal && pnpm install --frozen-lockfile && pnpm exec oxlint src && pnpm build
      - run: cd web/site && pnpm install --frozen-lockfile && pnpm build
      - run: cd web/probe && pnpm install --frozen-lockfile && pnpm build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      # A tag must clear the same gates as master: a red commit may not ship.
      - run: git ls-files '*.go' | xargs gofmt -l | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -race -timeout 20m ./...
      - run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o bin/captain-linux-$arch ./cmd/captain
          done
          # A binary linked against the builder's glibc does not start on
          # Alpine or any other musl distribution; and the binary must carry
          # the toolchain go.mod pins (a release once shipped with a Go that
          # had a dozen known fixes missing).
          want="go$(sed -n 's/^toolchain go//p' go.mod)"
          for f in bin/captain-linux-*; do
            file "$f"
            file "$f" | grep -q 'statically linked' || { echo "$f is dynamically linked"; exit 1; }
            got="$(go version "$f" | awk '{print $NF}')"
            echo "$f: $got"
            [ "$got" = "$want" ] || { echo "$f was built with $got, not $want"; exit 1; }
          done
          cd bin && sha256sum captain-linux-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.event_name == 'push'
        with:
          name: captain ${{ github.ref_name }}
          files: |
            bin/captain-linux-amd64
            bin/captain-linux-arm64
            bin/SHA256SUMS

  image:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with: { username: zeptop, password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          provenance: false
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/zeptop-dev/captain:${{ github.ref_name }}
            ghcr.io/zeptop-dev/captain:latest
            zeptop/captain:${{ github.ref_name }}
            zeptop/captain:latest
