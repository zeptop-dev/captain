name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: "web/*/pnpm-lock.yaml" }
      - run: python3 scripts/i18n-check.py web/admin/src/i18n web/portal/src/i18n
      - run: cd web/admin && pnpm install --frozen-lockfile && pnpm exec oxlint src && pnpm build
      - run: cd web/portal && pnpm install --frozen-lockfile && pnpm exec oxlint src && pnpm build
      - run: cd web/site && pnpm install --frozen-lockfile && pnpm build
      - run: cd web/probe && pnpm install --frozen-lockfile && pnpm build
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      # A tag must clear the same gates as master: a red commit may not ship.
      - run: git ls-files '*.go' | xargs gofmt -l | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -race ./...
      - run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o bin/captain-linux-$arch ./cmd/captain
          done
          cd bin && sha256sum captain-linux-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          name: captain ${{ github.ref_name }}
          files: |
            bin/captain-linux-amd64
            bin/captain-linux-arm64
            bin/SHA256SUMS

  image:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/login-action@v4
        with: { username: zeptop, password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/zeptop-dev/captain:${{ github.ref_name }}
            ghcr.io/zeptop-dev/captain:latest
            zeptop/captain:${{ github.ref_name }}
            zeptop/captain:latest
