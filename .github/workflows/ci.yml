name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 9 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm, cache-dependency-path: "web/*/pnpm-lock.yaml" }
      - run: python3 scripts/i18n-check.py web/admin/src/i18n web/portal/src/i18n web/probe/src/i18n web/site/src/i18n
      - run: cd web/admin && pnpm install --frozen-lockfile && pnpm test && pnpm exec oxlint src && pnpm build
      - run: cd web/portal && pnpm install --frozen-lockfile && pnpm exec oxlint src && pnpm build
      - run: cd web/site && pnpm install --frozen-lockfile && pnpm test && pnpm exec oxlint src && pnpm build
      - run: cd web/probe && pnpm install --frozen-lockfile && pnpm build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: git ls-files '*.go' | xargs gofmt -l | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # The HTTP suite already takes about 20 minutes with race and coverage.
      - run: go test -race -timeout 30m -coverpkg=./... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
