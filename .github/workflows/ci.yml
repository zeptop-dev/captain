name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: "web/*/pnpm-lock.yaml" }
      - run: cd web/admin && pnpm install --frozen-lockfile && pnpm build
      - run: cd web/portal && pnpm install --frozen-lockfile && pnpm build
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: git ls-files '*.go' | xargs gofmt -l | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./...
      - run: go test ./...
