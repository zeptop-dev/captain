# Advisories land without any change in this repo, and a Go patch release only
# reaches the shipped binaries when the toolchain line in go.mod moves, so the
# scan also runs weekly. A red run here means: bump the toolchain or the module.
name: vuln
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: go version
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
